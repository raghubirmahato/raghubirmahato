name: Regenerate GitHub stats cards

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: raghubirrajmahato15
        run: python scripts/generate_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats-card.svg top-langs.svg streak-stats.svg
          git diff --cached --quiet || git commit -m "chore: refresh GitHub stats cards"
          git push
